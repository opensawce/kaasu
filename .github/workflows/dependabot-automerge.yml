name: dependabot-automerge
on: pull_request_target
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.repository == 'opensawce/kaasu'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with: { github-token: '${{ secrets.GITHUB_TOKEN }}' }
      # Only website npm packages, and never a major version. Actions and everything else stay manual.
      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR"
          gh pr merge --auto --squash "$PR"
