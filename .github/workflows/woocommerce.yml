name: woocommerce
on:
  pull_request:
    paths: ['integrations/woocommerce/**']
  push:
    branches: [main]
    paths: ['integrations/woocommerce/**']
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.2' }
      - run: find integrations/woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php integrations/woocommerce/tests/run.php
