name: woocommerce
on:
  pull_request:
    paths: ['integrations/woocommerce/**']
  push:
    branches: [main]
    paths: ['integrations/woocommerce/**']
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.2' }
      - run: find integrations/woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php integrations/woocommerce/tests/run.php
