<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210" role="img" aria-label="Paisu, the Kaasu coin mascot, waving hello">
  <style>
    .bob { animation: bob 1.6s ease-in-out infinite; transform-origin: 100px 190px; }
    .shadow { animation: shadow 1.6s ease-in-out infinite; transform-origin: 100px 200px; }
    .wave { animation: wave 0.7s ease-in-out infinite alternate; transform-origin: 160px 92px; }
    .spark { animation: spark 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark.b { animation-delay: 0.8s; }
    .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shadow { 0%, 100% { transform: scale(1); opacity: 0.14; } 50% { transform: scale(0.8); opacity: 0.07; } }
    @keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(20deg); } }
    @keyframes spark { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.15); } }
    @media (prefers-reduced-motion: reduce) {
      .bob, .shadow, .wave, .spark, .blink { animation: none; }
      .spark { opacity: 1; }
    }
  </style>

  <ellipse class="shadow" cx="100" cy="200" rx="44" ry="6" fill="#14171A" opacity="0.14"/>

  <g class="bob">
    <path d="M86 160 V182 M114 160 V182" stroke="#14171A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M79 184 H90 M110 184 H121" stroke="#14171A" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M40 104 C28 112 26 124 30 136" stroke="#14171A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g class="wave">
      <path d="M160 92 C172 78 174 62 168 50" stroke="#14171A" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="168" cy="47" r="6" fill="#14171A"/>
    </g>
    <circle cx="100" cy="98" r="66" fill="#E8A33D" stroke="#B97A1E" stroke-width="6"/>
    <circle cx="100" cy="98" r="52" fill="none" stroke="#F4C46E" stroke-width="3"/>
    <path d="M58 72 A48 48 0 0 1 84 50" stroke="#FFF4DC" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="68" cy="114" rx="8" ry="5" fill="#E36F47" opacity="0.45"/>
    <ellipse cx="132" cy="114" rx="8" ry="5" fill="#E36F47" opacity="0.45"/>
    <g class="blink">
      <ellipse cx="82" cy="94" rx="7" ry="10" fill="#14171A"/>
      <ellipse cx="118" cy="94" rx="7" ry="10" fill="#14171A"/>
      <circle cx="85" cy="90" r="2.5" fill="#FFFFFF"/>
      <circle cx="121" cy="90" r="2.5" fill="#FFFFFF"/>
    </g>
    <path d="M80 116 Q100 142 120 116 Z" fill="#14171A"/>
    <path d="M90 128 Q100 136 110 128" fill="#E36F47"/>
  </g>

  <path class="spark" d="M24 26 V42 M16 34 H32" stroke="#0F7B5F" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path class="spark b" d="M184 112 V124 M178 118 H190" stroke="#0F7B5F" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
